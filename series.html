<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Series</title>

  <link rel="stylesheet" href="series.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="navbar">

    <div class="logo">
      MOVIEFLIX
    </div>

    <div class="menu">
      <a href="index.html">Home</a>
	  
      <a href="movies.html">Movies</a>
	  
      <a href="series.html">Series</a>
	  
      <a href="popular.html">Popular</a>
	  
	  <a href="membership.html">Membership</a>
    </div>

    <div class="icons">
      <input type="text" id="search" placeholder="Search Series">
      <i class="fa-solid fa-user"></i>
    </div>

  </div>

  <div class="page-title">

    <h1>Series Collection</h1>

    <select id="category">
      <option value="all">All</option>
      <option value="Drama">Drama</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Crime">Crime</option>
      <option value="Fantasy">Fantasy</option>
    </select>

  </div>

  <div class="category-section drama-section">
    <h2>Drama Series</h2>
    <div class="series-container" id="dramaSeries"></div>
  </div>


  <div class="category-section scifi-section">
    <h2>Sci-Fi Series</h2>
    <div class="series-container" id="scifiSeries"></div>
  </div>


  <div class="category-section crime-section">
    <h2>Crime Series</h2>
    <div class="series-container" id="crimeSeries"></div>
  </div>

  <div class="category-section fantasy-section">
    <h2>Fantasy Series</h2>
    <div class="series-container" id="fantasySeries"></div>
  </div>


  <div class="modal" id="modal">

    <div class="modal-content">

      <span id="close">&times;</span>

      <img id="modalImg">

      <h2 id="modalTitle"></h2>

      <p id="modalDesc"></p>

    </div>

  </div>

  <script src="series.js"></script>

</body>
</html>
